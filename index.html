<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Simple 3D Parkour</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div id="hud">
      <h1>3D Parkour</h1>
      <p><strong>Move:</strong> WASD / Arrow Keys</p>
      <p><strong>Jump:</strong> Space</p>
      <p><strong>Sprint:</strong> Shift</p>
      <p><strong>Camera:</strong> Mouse drag</p>
      <p id="status">Reach the glowing finish pad!</p>
    </div>
    <canvas id="game"></canvas>

    <script type="module" src="game.js"></script>
  </body>
</html>
